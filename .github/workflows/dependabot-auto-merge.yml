name: Dependabot auto-merge

on:
  pull_request:
  workflow_run:
    workflows: ["CodeQL", "Gitleaks", "Security Scan"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major version bump for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label major-version-bump
          gh pr edit "$PR_URL" --add-reviewer AgustinH09
          gh pr comment "$PR_URL" --body "@AgustinH09 not auto-merged: **${DEP}** is a major version bump (${FROM} -> ${TO}). Please check the changelog for breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEP: ${{ steps.metadata.outputs.dependency-names }}
          FROM: ${{ steps.metadata.outputs.previous-version }}
          TO: ${{ steps.metadata.outputs.new-version }}

  on-check-failure:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.pull_requests[0] != null
    steps:
      - name: Flag failing check for manual review
        run: |
          if gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx ci-failing; then
            echo "Already flagged, skipping."
            exit 0
          fi

          gh pr edit "$NUMBER" --repo "$REPO" --add-label ci-failing
          gh pr edit "$NUMBER" --repo "$REPO" --add-reviewer AgustinH09
          gh pr comment "$NUMBER" --repo "$REPO" --body "@AgustinH09 not auto-merged: **${WORKFLOW}** failed. See ${RUN_URL}"
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
